audio:
  sample_rate: 16000
  channels: 1
  dtype: float32
  chunk_size: 1024
  device: null
  max_recording_seconds: 15.0
  min_recording_seconds: 0.3
  queue_max_chunks: 100
  auto_resample: true

vad:
  # Aggressiveness: 0=least sensitive, 3=most sensitive to speech
  # Higher values are better for noisy environments, lower for quiet rooms
  aggressiveness: 2
  frame_ms: 30
  # Energy threshold (RMS) - adjust based on microphone noise floor
  # 0.0035 is tuned for standard USB / desk distance mics (noise floor ~0.001-0.002)
  energy_threshold: 0.0035
  # Minimum speech duration before considering speech started
  # 120ms (2 chunks) ensures short greetings ("hello", "hi") trigger promptly
  min_speech_ms: 120
  # Silence threshold - time of silence before speech is considered ended
  # 600ms prevents premature clipping of trailing disyllabic words
  silence_ms: 600
  # Pre-speech buffer - audio captured before voice detection
  # 384ms (6 chunks) reliably captures unvoiced initial consonants ("h" in "hello")
  pre_speech_ms: 384

stt:
  model_path: models/whisper/ggml-tiny.en.bin
  language: en
  n_threads: 4
  initial_prompt: "Hello, hi, greetings, I.T.S Engineering College, Greater Noida, APJ Abdul Kalam Technical University, AKTU, B.Tech, CSE, Computer Science, ECE, Electronics, ME, Mechanical, Civil, MBA, MCA, admission, fees, eligibility, hostel, placement, registrar, scholarship, campus, Greeto."
  max_text_length: 500
  min_text_length: 3

tts:
  # auto tries the in-process Piper voice first (voice model loaded once)
  # and falls back to the piper subprocess. python forces in-process,
  # subprocess forces the old cold-start behavior.
  engine: auto
  # Piper speaking-rate multiplier: <1.0 is faster, >1.0 is slower.
  length_scale: 1.0

pipeline:
  publish_events: true
  max_concurrent_transcriptions: 1
  mute_during_speech: true
  speech_cooldown_seconds: 0.3
  # Write every recorded utterance to logs/debug_last_recorded.wav so a
  # misrecognized short greeting can be inspected against the real mic input.
  debug_save_audio: true
